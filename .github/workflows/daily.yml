name: PullRadar quotidiano
on:
  workflow_dispatch:
  schedule:
    - cron: '17 7 * * *'
      timezone: Europe/Rome
    - cron: '25 19 * * *'
      timezone: Europe/Rome
    - cron: '35 19 * * *'
      timezone: Europe/Rome
    - cron: '15 21 * * *'
      timezone: Europe/Rome
permissions:
  contents: write
concurrency:
  group: pullradar-daily
  cancel-in-progress: false
jobs:
  prepare-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Verify Buffer channel
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_ID: ${{ vars.BUFFER_CHANNEL_ID }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          channel = os.environ['BUFFER_CHANNEL_ID']
          query = 'query { channel(input:{id:' + json.dumps(channel) + '}) { id name service isDisconnected isLocked isQueuePaused } }'
          request = urllib.request.Request('https://api.buffer.com', data=json.dumps({'query': query}).encode(), headers={'Authorization': 'Bearer ' + os.environ['BUFFER_API_KEY'], 'Content-Type': 'application/json'}, method='POST')
          with urllib.request.urlopen(request, timeout=30) as response:
              result = json.load(response)
          if result.get('errors'):
              raise RuntimeError(result['errors'])
          found = result.get('data', {}).get('channel') or {}
          if found.get('id') != channel or found.get('service') != 'instagram' or any(found.get(k) for k in ('isDisconnected', 'isLocked', 'isQueuePaused')):
              raise RuntimeError('Canale Instagram Buffer non disponibile')
          print('Canale Buffer verificato:', found['name'])
          PY
      - name: Read Instagram insights
        if: github.event.schedule != '15 21 * * *'
        continue-on-error: true
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_ID: ${{ vars.BUFFER_CHANNEL_ID }}
        run: python pullradar.py insights
      - name: Prepare verified market content
        if: github.event.schedule != '15 21 * * *'
        run: python pullradar.py prepare
      - name: Save public media
        if: github.event.schedule != '15 21 * * *'
        run: |
          git config user.name 'pullradar-bot'
          git config user.email 'pullradar-bot@users.noreply.github.com'
          git add public state.json snapshots.json
          if ! git diff --cached --quiet; then git commit -m 'Daily PullRadar assets'; git push; fi
      - name: Schedule on Buffer
        if: github.event.schedule != '15 21 * * *'
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_ID: ${{ vars.BUFFER_CHANNEL_ID }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python pullradar.py publish
      - name: Audit sent posts and stories
        if: github.event.schedule == '15 21 * * *'
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: python pullradar.py audit
